<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>骗子酒馆 · 撒谎，或者扣下扳机</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ═══════════ 大厅 ═══════════ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-box">
      <h1 class="title">🍺 骗子酒馆</h1>
      <p class="subtitle">—— 撒谎，或者扣下扳机 ——</p>
      <input id="nickname" class="input" maxlength="12" placeholder="你的绰号" />
      <div class="lobby-actions">
        <button id="btn-create" class="btn btn-gold">🎴 创建房间</button>
      </div>
      <div class="lobby-join">
        <input id="join-code" class="input input-code" maxlength="4" placeholder="房号" />
        <button id="btn-join" class="btn btn-dark">🚪 加入房间</button>
      </div>
      <details class="rules-brief">
        <summary>📖 玩法速览</summary>
        <div>
          <p>每人 5 张牌，本局指定一个目标牌（K/Q/A）。轮到你时：<b>扣 1-3 张牌</b>宣称是目标牌（可以撒谎），或者<b>质疑</b>上家。</p>
          <p>翻牌验真：混有假牌 → 出牌者上轮盘；全是真牌 → 质疑者上轮盘。轮盘 6 弹巢 1 子弹，被罚次数越多扣的扳机越多。</p>
          <p>🃏 王是万能牌。<b>恶魔模式</b>：😈恶魔牌只能单独出，被质疑翻开时全桌有手牌的都要陪拉扳机，只有打牌的人幸免。</p>
          <p>活到最后，就是赢家。</p>
        </div>
      </details>
    </div>
  </section>

  <!-- ═══════════ 房间 ═══════════ -->
  <section id="screen-room" class="screen hidden">
    <div class="room-box">
      <div class="room-head">
        <span class="room-code">房号 <b id="room-code">----</b> <button id="btn-copy" class="btn-mini" title="复制房号">📋</button></span>
        <button id="btn-leave" class="btn btn-dark btn-small">← 退出</button>
      </div>
      <div id="room-seats" class="room-seats"></div>
      <div class="room-mode" id="room-mode-box">
        <span>模式：</span>
        <label class="mode-opt"><input type="radio" name="mode" value="normal" checked /> 普通牌局</label>
        <label class="mode-opt devil"><input type="radio" name="mode" value="devil" /> 恶魔牌局 😈</label>
      </div>
      <div class="room-actions">
        <button id="btn-add-bot" class="btn btn-dark">🤖 添加机器人</button>
        <button id="btn-start" class="btn btn-gold">▶ 开始游戏</button>
      </div>
      <p class="room-tip" id="room-tip"></p>
    </div>
  </section>

  <!-- ═══════════ 牌桌 ═══════════ -->
  <section id="screen-game" class="screen hidden">
    <div class="game-wrap">
      <main class="table-area">
        <header class="game-head">
          <span id="g-round" class="g-round"></span>
          <span id="g-mode" class="g-mode"></span>
          <span class="head-btns">
            <button id="btn-mute" class="btn-mini" title="音效开关">🔊</button>
            <button id="btn-rules" class="btn-mini" title="规则">📖</button>
          </span>
        </header>
        <div id="opponents" class="opponents"></div>
        <div class="table-center">
          <div class="target-box">
            <span class="target-label">本局目标</span>
            <div id="target-card" class="target-card">K</div>
          </div>
          <div class="pile-box">
            <div class="pile-stack">
              <div class="card-back back3"></div>
              <div class="card-back back2"></div>
              <div class="card-back back1"></div>
            </div>
            <span id="pile-count" class="pile-count">0</span>
          </div>
          <div id="last-play" class="last-play">等待开局…</div>
        </div>
        <div class="self-panel">
          <div class="self-info">
            <span id="self-avatar" class="avatar"></span>
            <span id="self-name" class="pname"></span>
            <span id="self-badges" class="badges"></span>
          </div>
          <div id="hand" class="hand"></div>
          <div class="action-row">
            <span id="action-hint" class="action-hint"></span>
            <button id="btn-play" class="btn btn-gold" disabled>🎴 出牌</button>
            <button id="btn-call" class="btn btn-danger" disabled>❗ 质疑！</button>
          </div>
        </div>
      </main>
      <aside class="log-panel">
        <h3>📜 战报</h3>
        <div id="log-list" class="log-list"></div>
      </aside>
    </div>
  </section>

  <!-- ═══════════ 覆盖层 / 提示 ═══════════ -->
  <div id="overlay" class="overlay hidden"></div>
  <div id="banner" class="banner hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
